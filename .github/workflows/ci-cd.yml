name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Check formatting
        run: npm run format:check --if-present

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run --if-present

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build --if-present

  auto-tag:
    name: Auto Tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    permissions:
      contents: write

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        id: version
        env:
          VERSION_MAJOR: ${{ vars.VERSION_MAJOR }}
          VERSION_MINOR: ${{ vars.VERSION_MINOR }}
        run: |
          if [ -z "$VERSION_MAJOR" ] || [ -z "$VERSION_MINOR" ]; then
            echo "ERROR: VERSION_MAJOR and VERSION_MINOR must be set in GitHub repository variables"
            exit 1
          fi

          git fetch --tags

          PREFIX="v${VERSION_MAJOR}.${VERSION_MINOR}."

          LATEST=$(git tag --sort=-v:refname | grep -E "^${PREFIX}[0-9]+$" | head -1 || true)

          if [ -z "$LATEST" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${VERSION_MAJOR}.${VERSION_MINOR}.${PATCH}"

          echo "Tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - auto-tag
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.auto-tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes